<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3600 5535" width="3600" height="5535">
<text x="1800" y="540" fill="#f4f1ea" font-family="'Inter', 'Helvetica Neue', 'Arial', sans-serif" font-size="500" font-weight="800" font-style="normal" text-anchor="middle" letter-spacing="18">
<tspan x="1800" dy="0">ALIVE IN</tspan>
<tspan x="1800" dy="610.0">THE SPIRIT</tspan>
</text>
<text x="1800" y="1625.0" fill="#f4f1ea" font-family="'EB Garamond', 'Garamond', 'Hoefler Text', 'Times New Roman', serif" font-size="160" font-weight="normal" font-style="normal" text-anchor="middle" letter-spacing="0">
<tspan x="1800" dy="0">I believe that I cannot by my own reason or</tspan>
<tspan x="1800" dy="195.2">strength believe in Jesus Christ, my Lord,</tspan>
<tspan x="1800" dy="195.2">or come to him; but the Holy Spirit has</tspan>
<tspan x="1800" dy="195.2">called me by the gospel, enlightened me with</tspan>
<tspan x="1800" dy="195.2">his gifts, sanctified and kept me in the</tspan>
<tspan x="1800" dy="195.2">true faith.</tspan>
</text>
<text x="1800" y="2913.0" fill="#f4f1ea" font-family="'EB Garamond', 'Garamond', 'Hoefler Text', 'Times New Roman', serif" font-size="160" font-weight="normal" font-style="normal" text-anchor="middle" letter-spacing="0">
<tspan x="1800" dy="0">In the same way he calls, gathers,</tspan>
<tspan x="1800" dy="195.2">enlightens, and sanctifies the whole</tspan>
<tspan x="1800" dy="195.2">Christian church on earth, and keeps it with</tspan>
<tspan x="1800" dy="195.2">Jesus Christ in the one true faith.</tspan>
</text>
<text x="1800" y="3810.6" fill="#f4f1ea" font-family="'EB Garamond', 'Garamond', 'Hoefler Text', 'Times New Roman', serif" font-size="160" font-weight="normal" font-style="normal" text-anchor="middle" letter-spacing="0">
<tspan x="1800" dy="0">In this Christian church he daily and richly</tspan>
<tspan x="1800" dy="195.2">forgives all my sins and the sins of all</tspan>
<tspan x="1800" dy="195.2">believers.</tspan>
</text>
<text x="1800" y="4513.0" fill="#f4f1ea" font-family="'EB Garamond', 'Garamond', 'Hoefler Text', 'Times New Roman', serif" font-size="160" font-weight="normal" font-style="normal" text-anchor="middle" letter-spacing="0">
<tspan x="1800" dy="0">On the last day he will raise me and all the</tspan>
<tspan x="1800" dy="195.2">dead, and give eternal life to me and all</tspan>
<tspan x="1800" dy="195.2">believers in Christ.</tspan>
</text>
<text x="1800" y="5255.4" fill="#f4f1ea" font-family="'EB Garamond', 'Garamond', 'Hoefler Text', 'Times New Roman', serif" font-size="220" font-weight="normal" font-style="italic" text-anchor="middle" letter-spacing="0">
<tspan x="1800" dy="0">This is most certainly true.</tspan>
</text>
</svg>
