<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3600 6656" width="3600" height="6656">
<text x="1800" y="1740" fill="#f4f1ea" font-family="'Archivo Black', 'Inter', 'Helvetica Neue', 'Arial Black', sans-serif" font-size="500" font-weight="900" font-style="normal" text-anchor="middle" letter-spacing="8">
<tspan x="1800" dy="0">ALIVE IN</tspan>
<tspan x="1800" dy="610.0">THE SPIRIT</tspan>
</text>
<line x1="1560" y1="2600.0" x2="2040" y2="2600.0" stroke="#f4f1ea" stroke-width="7"/>
<text x="1800" y="2850.0" fill="#f4f1ea" font-family="'EB Garamond', 'Garamond', 'Hoefler Text', 'Times New Roman', serif" font-size="180" font-weight="normal" font-style="normal" text-anchor="middle" letter-spacing="0">
<tspan x="1800" dy="0">I believe that I cannot by my own reason or</tspan>
<tspan x="1800" dy="219.6">strength believe in Jesus Christ, my Lord,</tspan>
<tspan x="1800" dy="219.6">or come to Him; but the Holy Ghost has</tspan>
<tspan x="1800" dy="219.6">called me by the Gospel, enlightened me with</tspan>
<tspan x="1800" dy="219.6">His gifts, sanctified and kept me</tspan>
<tspan x="1800" dy="219.6">in the true faith;</tspan>
</text>
<text x="1800" y="4245.0" fill="#f4f1ea" font-family="'EB Garamond', 'Garamond', 'Hoefler Text', 'Times New Roman', serif" font-size="180" font-weight="normal" font-style="normal" text-anchor="middle" letter-spacing="0">
<tspan x="1800" dy="0">even as He calls, gathers, enlightens, and</tspan>
<tspan x="1800" dy="219.6">sanctifies the whole Christian Church on</tspan>
<tspan x="1800" dy="219.6">earth, and keeps it with Jesus Christ in</tspan>
<tspan x="1800" dy="219.6">the one true faith;</tspan>
</text>
<text x="1800" y="5200.8" fill="#f4f1ea" font-family="'EB Garamond', 'Garamond', 'Hoefler Text', 'Times New Roman', serif" font-size="180" font-weight="normal" font-style="normal" text-anchor="middle" letter-spacing="0">
<tspan x="1800" dy="0">in which Christian Church He forgives daily</tspan>
<tspan x="1800" dy="219.6">and richly all sins to me and all believers,</tspan>
<tspan x="1800" dy="219.6">and at the last day will raise up me and all</tspan>
<tspan x="1800" dy="219.6">the dead, and will give to me and to all</tspan>
<tspan x="1800" dy="219.6">believers in Christ everlasting life.</tspan>
</text>
<text x="1800" y="6376.2" fill="#f4f1ea" font-family="'EB Garamond', 'Garamond', 'Hoefler Text', 'Times New Roman', serif" font-size="220" font-weight="normal" font-style="italic" text-anchor="middle" letter-spacing="0">
<tspan x="1800" dy="0">This is most certainly true.</tspan>
</text>
</svg>
