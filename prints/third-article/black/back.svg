<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3600 5340" width="3600" height="5340">
<text x="1800" y="540" fill="#f4f1ea" font-family="'Inter', 'Helvetica Neue', 'Arial', sans-serif" font-size="500" font-weight="800" font-style="normal" text-anchor="middle" letter-spacing="18">
<tspan x="1800" dy="0">ALIVE IN</tspan>
<tspan x="1800" dy="610.0">THE SPIRIT</tspan>
</text>
<text x="1800" y="1625.0" fill="#f4f1ea" font-family="'EB Garamond', 'Garamond', 'Hoefler Text', 'Times New Roman', serif" font-size="160" font-weight="normal" font-style="normal" text-anchor="middle" letter-spacing="0">
<tspan x="1800" dy="0">I believe that I cannot by my own reason or</tspan>
<tspan x="1800" dy="195.2">strength believe in Jesus Christ, my Lord,</tspan>
<tspan x="1800" dy="195.2">or come to Him; but the Holy Ghost has called</tspan>
<tspan x="1800" dy="195.2">me by the Gospel, enlightened me with His</tspan>
<tspan x="1800" dy="195.2">gifts, sanctified and kept me in the true</tspan>
<tspan x="1800" dy="195.2">faith;</tspan>
</text>
<text x="1800" y="2913.0" fill="#f4f1ea" font-family="'EB Garamond', 'Garamond', 'Hoefler Text', 'Times New Roman', serif" font-size="160" font-weight="normal" font-style="normal" text-anchor="middle" letter-spacing="0">
<tspan x="1800" dy="0">even as He calls, gathers, enlightens, and</tspan>
<tspan x="1800" dy="195.2">sanctifies the whole Christian Church on</tspan>
<tspan x="1800" dy="195.2">earth, and keeps it with Jesus Christ in the</tspan>
<tspan x="1800" dy="195.2">one true faith;</tspan>
</text>
<text x="1800" y="3810.6" fill="#f4f1ea" font-family="'EB Garamond', 'Garamond', 'Hoefler Text', 'Times New Roman', serif" font-size="160" font-weight="normal" font-style="normal" text-anchor="middle" letter-spacing="0">
<tspan x="1800" dy="0">in which Christian Church He forgives daily</tspan>
<tspan x="1800" dy="195.2">and richly all sins to me and all believers,</tspan>
</text>
<text x="1800" y="4317.799999999999" fill="#f4f1ea" font-family="'EB Garamond', 'Garamond', 'Hoefler Text', 'Times New Roman', serif" font-size="160" font-weight="normal" font-style="normal" text-anchor="middle" letter-spacing="0">
<tspan x="1800" dy="0">and at the last day will raise up me and all</tspan>
<tspan x="1800" dy="195.2">the dead, and will give to me and to all</tspan>
<tspan x="1800" dy="195.2">believers in Christ everlasting life.</tspan>
</text>
<text x="1800" y="5060.199999999999" fill="#f4f1ea" font-family="'EB Garamond', 'Garamond', 'Hoefler Text', 'Times New Roman', serif" font-size="220" font-weight="normal" font-style="italic" text-anchor="middle" letter-spacing="0">
<tspan x="1800" dy="0">This is most certainly true.</tspan>
</text>
</svg>
