<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3600 7316" width="3600" height="7316">
<text x="1800" y="1740" fill="#f4f1ea" font-family="'Archivo Black', 'Inter', 'Helvetica Neue', 'Arial Black', sans-serif" font-size="500" font-weight="900" font-style="normal" text-anchor="middle" letter-spacing="8">
<tspan x="1800" dy="0">DEAD IN SIN</tspan>
</text>
<line x1="1560" y1="1990.0" x2="2040" y2="1990.0" stroke="#f4f1ea" stroke-width="7"/>
<text x="1800" y="2240.0" fill="#e63946" font-family="'EB Garamond', 'Garamond', 'Hoefler Text', 'Times New Roman', serif" font-size="195" font-weight="normal" font-style="normal" text-anchor="middle" letter-spacing="0">
<tspan x="1800" dy="0">“No man can come to me, except the</tspan>
<tspan x="1800" dy="237.9">Father which hath sent me draw him: and</tspan>
<tspan x="1800" dy="237.9">I will raise him up at the last day.”</tspan>
</text>
<text x="1800" y="2840.6000000000004" fill="#9a948a" font-family="'Inter', 'Helvetica Neue', 'Arial', sans-serif" font-size="78" font-weight="600" font-style="normal" text-anchor="middle" letter-spacing="10">
<tspan x="1800" dy="0">JOHN 6:44</tspan>
</text>
<text x="1800" y="3094.1000000000004" fill="#f4f1ea" font-family="'EB Garamond', 'Garamond', 'Hoefler Text', 'Times New Roman', serif" font-size="195" font-weight="normal" font-style="normal" text-anchor="middle" letter-spacing="0">
<tspan x="1800" dy="0">“For by grace are ye saved through</tspan>
<tspan x="1800" dy="237.9">faith; and that not of yourselves: it</tspan>
<tspan x="1800" dy="237.9">is the gift of God: Not of works, lest</tspan>
<tspan x="1800" dy="237.9">any man should boast.”</tspan>
</text>
<text x="1800" y="3932.6000000000004" fill="#9a948a" font-family="'Inter', 'Helvetica Neue', 'Arial', sans-serif" font-size="78" font-weight="600" font-style="normal" text-anchor="middle" letter-spacing="10">
<tspan x="1800" dy="0">EPHESIANS 2:8-9</tspan>
</text>
<text x="1800" y="4186.1" fill="#f4f1ea" font-family="'EB Garamond', 'Garamond', 'Hoefler Text', 'Times New Roman', serif" font-size="195" font-weight="normal" font-style="normal" text-anchor="middle" letter-spacing="0">
<tspan x="1800" dy="0">“Because the carnal mind is enmity</tspan>
<tspan x="1800" dy="237.9">against God: for it is not subject to</tspan>
<tspan x="1800" dy="237.9">the law of God, neither indeed can be.</tspan>
<tspan x="1800" dy="237.9">So then they that are in the</tspan>
<tspan x="1800" dy="237.9">flesh cannot please God.”</tspan>
</text>
<text x="1800" y="5262.500000000001" fill="#9a948a" font-family="'Inter', 'Helvetica Neue', 'Arial', sans-serif" font-size="78" font-weight="600" font-style="normal" text-anchor="middle" letter-spacing="10">
<tspan x="1800" dy="0">ROMANS 8:7-8</tspan>
</text>
<text x="1800" y="5516.000000000001" fill="#f4f1ea" font-family="'EB Garamond', 'Garamond', 'Hoefler Text', 'Times New Roman', serif" font-size="195" font-weight="normal" font-style="normal" text-anchor="middle" letter-spacing="0">
<tspan x="1800" dy="0">“For the flesh lusteth against the</tspan>
<tspan x="1800" dy="237.9">Spirit, and the</tspan>
<tspan x="1800" dy="237.9">Spirit against the flesh…”</tspan>
</text>
<text x="1800" y="6116.600000000001" fill="#9a948a" font-family="'Inter', 'Helvetica Neue', 'Arial', sans-serif" font-size="78" font-weight="600" font-style="normal" text-anchor="middle" letter-spacing="10">
<tspan x="1800" dy="0">GALATIANS 5:17</tspan>
</text>
<text x="1800" y="6370.100000000001" fill="#f4f1ea" font-family="'EB Garamond', 'Garamond', 'Hoefler Text', 'Times New Roman', serif" font-size="195" font-weight="normal" font-style="normal" text-anchor="middle" letter-spacing="0">
<tspan x="1800" dy="0">“…no man can say that Jesus is the Lord,</tspan>
<tspan x="1800" dy="237.9">but by the Holy Ghost.”</tspan>
</text>
<text x="1800" y="6732.800000000001" fill="#9a948a" font-family="'Inter', 'Helvetica Neue', 'Arial', sans-serif" font-size="78" font-weight="600" font-style="normal" text-anchor="middle" letter-spacing="10">
<tspan x="1800" dy="0">1 CORINTHIANS 12:3</tspan>
</text>
<text x="1800" y="7036.800000000001" fill="#f4f1ea" font-family="'EB Garamond', 'Garamond', 'Hoefler Text', 'Times New Roman', serif" font-size="320" font-weight="normal" font-style="italic" text-anchor="middle" letter-spacing="0">
<tspan x="1800" dy="0">Therefore...</tspan>
</text>
</svg>
