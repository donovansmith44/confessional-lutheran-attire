<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3600 5786" width="3600" height="5786">
<text x="1800" y="540" fill="#f4f1ea" font-family="'Inter', 'Helvetica Neue', 'Arial', sans-serif" font-size="500" font-weight="800" font-style="normal" text-anchor="middle" letter-spacing="18">
<tspan x="1800" dy="0">DEAD IN SIN</tspan>
</text>
<text x="1800" y="1015.0" fill="#e63946" font-family="'EB Garamond', 'Garamond', 'Hoefler Text', 'Times New Roman', serif" font-size="180" font-weight="normal" font-style="normal" text-anchor="middle" letter-spacing="0">
<tspan x="1800" dy="0">“No one can come to me unless the Father</tspan>
<tspan x="1800" dy="219.6">who sent me draws him.”</tspan>
</text>
<text x="1800" y="1349.8" fill="#9a948a" font-family="'Inter', 'Helvetica Neue', 'Arial', sans-serif" font-size="72" font-weight="600" font-style="normal" text-anchor="middle" letter-spacing="10">
<tspan x="1800" dy="0">JOHN 6:44</tspan>
</text>
<text x="1800" y="1628.8" fill="#f4f1ea" font-family="'EB Garamond', 'Garamond', 'Hoefler Text', 'Times New Roman', serif" font-size="180" font-weight="normal" font-style="normal" text-anchor="middle" letter-spacing="0">
<tspan x="1800" dy="0">For by grace you have been saved</tspan>
<tspan x="1800" dy="219.6">through faith. And this is not your own</tspan>
<tspan x="1800" dy="219.6">doing; it is the gift of God, not a</tspan>
<tspan x="1800" dy="219.6">result of works, so that no one may</tspan>
<tspan x="1800" dy="219.6">boast.</tspan>
</text>
<text x="1800" y="2622.3999999999996" fill="#9a948a" font-family="'Inter', 'Helvetica Neue', 'Arial', sans-serif" font-size="72" font-weight="600" font-style="normal" text-anchor="middle" letter-spacing="10">
<tspan x="1800" dy="0">EPHESIANS 2:8-9</tspan>
</text>
<text x="1800" y="2901.3999999999996" fill="#f4f1ea" font-family="'EB Garamond', 'Garamond', 'Hoefler Text', 'Times New Roman', serif" font-size="180" font-weight="normal" font-style="normal" text-anchor="middle" letter-spacing="0">
<tspan x="1800" dy="0">For the mind that is set on the flesh is</tspan>
<tspan x="1800" dy="219.6">hostile to God, for it does not submit</tspan>
<tspan x="1800" dy="219.6">to God's law; indeed, it cannot. Those</tspan>
<tspan x="1800" dy="219.6">who are in the flesh cannot please God.</tspan>
</text>
<text x="1800" y="3675.3999999999996" fill="#9a948a" font-family="'Inter', 'Helvetica Neue', 'Arial', sans-serif" font-size="72" font-weight="600" font-style="normal" text-anchor="middle" letter-spacing="10">
<tspan x="1800" dy="0">ROMANS 8:7-8</tspan>
</text>
<text x="1800" y="3954.3999999999996" fill="#f4f1ea" font-family="'EB Garamond', 'Garamond', 'Hoefler Text', 'Times New Roman', serif" font-size="180" font-weight="normal" font-style="normal" text-anchor="middle" letter-spacing="0">
<tspan x="1800" dy="0">For the desires of the flesh are</tspan>
<tspan x="1800" dy="219.6">against the Spirit, and the desires of</tspan>
<tspan x="1800" dy="219.6">the Spirit are against the flesh.</tspan>
</text>
<text x="1800" y="4508.799999999999" fill="#9a948a" font-family="'Inter', 'Helvetica Neue', 'Arial', sans-serif" font-size="72" font-weight="600" font-style="normal" text-anchor="middle" letter-spacing="10">
<tspan x="1800" dy="0">GALATIANS 5:17</tspan>
</text>
<text x="1800" y="4787.799999999999" fill="#f4f1ea" font-family="'EB Garamond', 'Garamond', 'Hoefler Text', 'Times New Roman', serif" font-size="180" font-weight="normal" font-style="normal" text-anchor="middle" letter-spacing="0">
<tspan x="1800" dy="0">No one can say "Jesus is Lord" except in</tspan>
<tspan x="1800" dy="219.6">the Holy Spirit.</tspan>
</text>
<text x="1800" y="5122.599999999999" fill="#9a948a" font-family="'Inter', 'Helvetica Neue', 'Arial', sans-serif" font-size="72" font-weight="600" font-style="normal" text-anchor="middle" letter-spacing="10">
<tspan x="1800" dy="0">1 CORINTHIANS 12:3</tspan>
</text>
<text x="1800" y="5506.599999999999" fill="#f4f1ea" font-family="'EB Garamond', 'Garamond', 'Hoefler Text', 'Times New Roman', serif" font-size="240" font-weight="normal" font-style="italic" text-anchor="middle" letter-spacing="0">
<tspan x="1800" dy="0">Therefore...</tspan>
</text>
</svg>
