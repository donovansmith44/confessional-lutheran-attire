<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3600 5248" width="3600" height="5248">
<text x="1800" y="540" fill="#15161a" font-family="'Archivo Black', 'Inter', 'Helvetica Neue', 'Arial Black', sans-serif" font-size="500" font-weight="900" font-style="normal" text-anchor="middle" letter-spacing="8">
<tspan x="1800" dy="0">ALIVE IN</tspan>
<tspan x="1800" dy="610.0">THE SPIRIT</tspan>
</text>
<line x1="1640" y1="1400.0" x2="1960" y2="1400.0" stroke="#4a4a4a" stroke-width="3" stroke-opacity="0.7"/>
<text x="1800" y="1650.0" fill="#15161a" font-family="'EB Garamond', 'Garamond', 'Hoefler Text', 'Times New Roman', serif" font-size="160" font-weight="normal" font-style="normal" text-anchor="middle" letter-spacing="0">
<tspan x="1800" dy="0">I believe that I cannot by my own reason or</tspan>
<tspan x="1800" dy="195.2">strength believe in Jesus Christ, my Lord,</tspan>
<tspan x="1800" dy="195.2">or come to Him; but the Holy Ghost has called</tspan>
<tspan x="1800" dy="195.2">me by the Gospel, enlightened me with His</tspan>
<tspan x="1800" dy="195.2">gifts, sanctified and kept me</tspan>
<tspan x="1800" dy="195.2">in the true faith;</tspan>
</text>
<text x="1800" y="2938.0" fill="#15161a" font-family="'EB Garamond', 'Garamond', 'Hoefler Text', 'Times New Roman', serif" font-size="160" font-weight="normal" font-style="normal" text-anchor="middle" letter-spacing="0">
<tspan x="1800" dy="0">even as He calls, gathers, enlightens, and</tspan>
<tspan x="1800" dy="195.2">sanctifies the whole Christian Church on</tspan>
<tspan x="1800" dy="195.2">earth, and keeps it with Jesus Christ in</tspan>
<tspan x="1800" dy="195.2">the one true faith;</tspan>
</text>
<text x="1800" y="3835.6" fill="#15161a" font-family="'EB Garamond', 'Garamond', 'Hoefler Text', 'Times New Roman', serif" font-size="160" font-weight="normal" font-style="normal" text-anchor="middle" letter-spacing="0">
<tspan x="1800" dy="0">in which Christian Church He forgives daily</tspan>
<tspan x="1800" dy="195.2">and richly all sins to me and all believers,</tspan>
<tspan x="1800" dy="195.2">and at the last day will raise up me and all</tspan>
<tspan x="1800" dy="195.2">the dead, and will give to me and to all</tspan>
<tspan x="1800" dy="195.2">believers in Christ everlasting life.</tspan>
</text>
<text x="1800" y="4968.4" fill="#15161a" font-family="'EB Garamond', 'Garamond', 'Hoefler Text', 'Times New Roman', serif" font-size="220" font-weight="normal" font-style="italic" text-anchor="middle" letter-spacing="0">
<tspan x="1800" dy="0">This is most certainly true.</tspan>
</text>
</svg>
