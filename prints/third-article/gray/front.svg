<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3600 5591" width="3600" height="5591">
<text x="1800" y="540" fill="#15161a" font-family="'Archivo Black', 'Inter', 'Helvetica Neue', 'Arial Black', sans-serif" font-size="500" font-weight="900" font-style="normal" text-anchor="middle" letter-spacing="8">
<tspan x="1800" dy="0">DEAD IN SIN</tspan>
</text>
<line x1="1640" y1="790.0" x2="1960" y2="790.0" stroke="#4a4a4a" stroke-width="3" stroke-opacity="0.7"/>
<text x="1800" y="1040.0" fill="#8a0e21" font-family="'EB Garamond', 'Garamond', 'Hoefler Text', 'Times New Roman', serif" font-size="180" font-weight="normal" font-style="normal" text-anchor="middle" letter-spacing="0">
<tspan x="1800" dy="0">“No man can come to me, except the</tspan>
<tspan x="1800" dy="219.6">Father which hath sent me draw him.”</tspan>
</text>
<text x="1800" y="1374.8" fill="#2a2a2a" font-family="'Inter', 'Helvetica Neue', 'Arial', sans-serif" font-size="72" font-weight="600" font-style="normal" text-anchor="middle" letter-spacing="10">
<tspan x="1800" dy="0">JOHN 6:44</tspan>
</text>
<text x="1800" y="1653.8" fill="#15161a" font-family="'EB Garamond', 'Garamond', 'Hoefler Text', 'Times New Roman', serif" font-size="180" font-weight="normal" font-style="normal" text-anchor="middle" letter-spacing="0">
<tspan x="1800" dy="0">For by grace are ye saved through</tspan>
<tspan x="1800" dy="219.6">faith; and that not of yourselves: it</tspan>
<tspan x="1800" dy="219.6">is the gift of God: not of works, lest</tspan>
<tspan x="1800" dy="219.6">any man should boast.</tspan>
</text>
<text x="1800" y="2427.7999999999997" fill="#2a2a2a" font-family="'Inter', 'Helvetica Neue', 'Arial', sans-serif" font-size="72" font-weight="600" font-style="normal" text-anchor="middle" letter-spacing="10">
<tspan x="1800" dy="0">EPHESIANS 2:8-9</tspan>
</text>
<text x="1800" y="2706.7999999999997" fill="#15161a" font-family="'EB Garamond', 'Garamond', 'Hoefler Text', 'Times New Roman', serif" font-size="180" font-weight="normal" font-style="normal" text-anchor="middle" letter-spacing="0">
<tspan x="1800" dy="0">The carnal mind is enmity against God:</tspan>
<tspan x="1800" dy="219.6">for it is not subject to the law of God,</tspan>
<tspan x="1800" dy="219.6">neither indeed can be. They that are in</tspan>
<tspan x="1800" dy="219.6">the flesh cannot please God.</tspan>
</text>
<text x="1800" y="3480.7999999999993" fill="#2a2a2a" font-family="'Inter', 'Helvetica Neue', 'Arial', sans-serif" font-size="72" font-weight="600" font-style="normal" text-anchor="middle" letter-spacing="10">
<tspan x="1800" dy="0">ROMANS 8:7-8</tspan>
</text>
<text x="1800" y="3759.7999999999993" fill="#15161a" font-family="'EB Garamond', 'Garamond', 'Hoefler Text', 'Times New Roman', serif" font-size="180" font-weight="normal" font-style="normal" text-anchor="middle" letter-spacing="0">
<tspan x="1800" dy="0">For the flesh lusteth against the</tspan>
<tspan x="1800" dy="219.6">Spirit, and the</tspan>
<tspan x="1800" dy="219.6">Spirit against the flesh.</tspan>
</text>
<text x="1800" y="4314.199999999999" fill="#2a2a2a" font-family="'Inter', 'Helvetica Neue', 'Arial', sans-serif" font-size="72" font-weight="600" font-style="normal" text-anchor="middle" letter-spacing="10">
<tspan x="1800" dy="0">GALATIANS 5:17</tspan>
</text>
<text x="1800" y="4593.199999999999" fill="#15161a" font-family="'EB Garamond', 'Garamond', 'Hoefler Text', 'Times New Roman', serif" font-size="180" font-weight="normal" font-style="normal" text-anchor="middle" letter-spacing="0">
<tspan x="1800" dy="0">No man can say that Jesus is the Lord,</tspan>
<tspan x="1800" dy="219.6">but by the Holy Ghost.</tspan>
</text>
<text x="1800" y="4927.999999999999" fill="#2a2a2a" font-family="'Inter', 'Helvetica Neue', 'Arial', sans-serif" font-size="72" font-weight="600" font-style="normal" text-anchor="middle" letter-spacing="10">
<tspan x="1800" dy="0">1 CORINTHIANS 12:3</tspan>
</text>
<text x="1800" y="5311.999999999999" fill="#15161a" font-family="'EB Garamond', 'Garamond', 'Hoefler Text', 'Times New Roman', serif" font-size="240" font-weight="normal" font-style="italic" text-anchor="middle" letter-spacing="0">
<tspan x="1800" dy="0">Therefore...</tspan>
</text>
</svg>
